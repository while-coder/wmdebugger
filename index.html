<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/png" href="/wmdebugger/icon.png" />
    <title>WMDebugger</title>
    <script>
      // 在 CSS/JS 加载前按已存主题设置 data-theme 与背景，避免深色模式首屏白闪
      (function () {
        try {
          var dark = localStorage.getItem("wm-debugger-theme") !== "light";
          var d = document.documentElement;
          d.dataset.theme = dark ? "dark" : "light";
          d.style.background = dark ? "#0f172a" : "#f3f4f6";
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/wmdebugger/assets/index-nHbTQoaI.js"></script>
    <link rel="stylesheet" crossorigin href="/wmdebugger/assets/index-CG7j0UI0.css">
  <link rel="manifest" href="/wmdebugger/manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
  </body>
</html>
